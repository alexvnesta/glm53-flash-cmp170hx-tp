name: Source and response lifecycle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP test dependencies
        run: python -m pip install fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 anyio==4.15.1 Jinja2==3.1.6
      - name: Reproduce and verify pinned engine source
        run: |
          ./engine/apply_engine.sh
          ./engine/apply_engine.sh --verify
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q service scripts engine experiments/concurrent_throughput experiments/recovery_headroom experiments/tokenizer
          python - <<'PY'
          import pathlib, subprocess
          for folder in ('scripts', 'engine', 'examples', 'service/scripts'):
              for path in pathlib.Path(folder).glob('*.sh'):
                  subprocess.run(['bash', '-n', str(path)], check=True)
          PY
      - name: Check request admission and streamed cleanup
        env:
          PYTHONPATH: service/glm
        run: |
          python -m unittest discover -s service/tests/http -v
          python service/scripts/check_response_lifetime_ast.py
      - name: Check model-router reload admission and stream leases
        run: python -m unittest discover -s service/model_router -v
      - name: Check optional Weightless format and engine hook on CPU
        run: |
          python -m pip install -r experiments/weightless/requirements-test.txt
          python -m pytest -q experiments/weightless/test_weightless.py
          python service/tests/test_weightless_options.py
      - name: Check bounded concurrency probe and isolated variant preparation
        run: python -m unittest discover -s experiments/concurrent_throughput -v
      - name: Check community benchmark counter observation
        run: python -m unittest discover -s experiments/community_benchmark -v
      - name: Regenerate the packaged community results from the retained runs
        run: |
          python experiments/community_benchmark/package.py
          git diff --exit-code -- experiments/community_benchmark/results docs/COMMUNITY_BENCHMARK_2026-10-17.md
      - name: Reproduce the measured four-slot community profile
        run: |
          python profiles/community-four-active/prepare.py "$RUNNER_TEMP/community-profile"
          bash -n profiles/community-four-active/run.sh
      - name: Reproduce cold graph capture scheduling on CPU
        run: python experiments/tp-graph-capture/test_capture_schedule.py
      - name: Check isolated KDA graph headroom policy on CPU
        run: python -m unittest discover -s experiments/recovery_headroom -p 'test_*.py' -v
      - name: Reproduce the Weightless variant manifest
        run: |
          python experiments/weightless/prepare_engine.py engine-src "$RUNNER_TEMP/weightless-engine"
          git -C "$RUNNER_TEMP/weightless-engine" apply "$GITHUB_WORKSPACE/experiments/tp-graph-capture/0001-nonblocking-graph-capture.patch"
          git -C "$RUNNER_TEMP/weightless-engine" apply "$GITHUB_WORKSPACE/experiments/tp-graph-capture/0002-release-gil-during-gated-mlp.patch"
          cd "$RUNNER_TEMP/weightless-engine"
          sha256sum -c "$GITHUB_WORKSPACE/profiles/weightless/engine.sha256"
